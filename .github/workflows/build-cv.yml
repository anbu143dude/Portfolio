name: Build CV PDF
on:
  push:
    branches: [main]
    paths:
      - 'Anand_Babu_P_CV.rtf'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert Word-compatible RTF to PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          mkdir -p /tmp/cv-out
          libreoffice --headless --convert-to pdf --outdir /tmp/cv-out Anand_Babu_P_CV.rtf
          libreoffice --headless --convert-to docx --outdir /tmp/cv-out Anand_Babu_P_CV.rtf
          test -s /tmp/cv-out/Anand_Babu_P_CV.pdf
          test -s /tmp/cv-out/Anand_Babu_P_CV.docx
          cp /tmp/cv-out/Anand_Babu_P_CV.pdf ./Anand_Babu_P_CV.pdf
          cp /tmp/cv-out/Anand_Babu_P_CV.docx ./Anand_Babu_P_CV.docx
      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Anand_Babu_P_CV.pdf Anand_Babu_P_CV.docx
          if ! git diff --cached --quiet; then
            git commit -m "Build updated CV PDF from Word-compatible source"
            git push
          fi
